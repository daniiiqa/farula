[package]
name = "farula"
version = "0.1.0"
edition = "2024"
description = "El telón de discada: congela la pantalla, deja pasar el cambio de wallpaper o de look por debajo y lo revela con un iris"
license = "MIT"

[dependencies]
libc = "0.2"
serde_json = "1"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
